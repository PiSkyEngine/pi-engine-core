# PiEngine Logging Configuration
handlers = java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level = FINEST
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Overall PiEngine logging level
org.piengine.level = FINEST

# Subsystem-specific levels
org.piengine.engine.level = FINEST
org.piengine.renderer.level = WARNING
org.piengine.asset.level = INFO
org.piengine.audio.level = INFO
org.piengine.input.level = INFO
org.piengine.physics.level = INFO